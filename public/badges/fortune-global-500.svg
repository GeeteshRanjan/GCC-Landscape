<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="532" viewBox="99.5362 341.715 1055.7113 532.1662" role="img" preserveAspectRatio="xMidYMid meet">
  <title>Fortune Global 500</title>
  <!-- Fortune's own artwork, supplied as a vector. Path coordinates are the supplied
       file's, unchanged, and so is the `translate/scale` below; the `viewBox` is the crop
       that takes the empty 1254x1254 artboard down to the lockup's own ink bounds,
       1055.71 x 532.17, 1.984:1. Bounds measured by rasterising and scanning alpha
       (npm run logo:crop), never read off the path data. Nothing is traced, refitted,
       re-cut or re-drawn.

       The supplied file fills all twelve paths black in ONE group. The red below is a
       FILL on a partition of those same paths, at the project owner's instruction: the
       FORTUNE plate, the rule box around GLOBAL 500, and the 500 itself. No outline
       moved, was split or was re-cut to achieve it.

       Two things a future editor gets wrong here. FORTUNE is KNOCKED OUT of its plate
       rather than drawn, so its letters take whatever ground the badge sits on and the
       badge needs a LIGHT one. And the two small paths after the plate are the ISLANDS
       inside its O and R - they are plate ink, not letter ink, so they follow the plate's
       fill and turn white if left black. -->

